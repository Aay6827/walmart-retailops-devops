name: RetailOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests and validate deployment config
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest tests/test_services.py -v
      - name: Validate Docker Compose and runtime security policy
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-only-placeholder
        run: |
          docker compose config --quiet
          python scripts/check_compose_security.py

  image-security:
    name: Build and report image vulnerabilities
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare report directory
        run: mkdir -p trivy-reports
      - name: Build RetailOps API image
        run: docker build -t retailops-api:ci -f Dockerfile .

      - name: Build order service image
        run: docker build -t order-service:ci -f order_service/Dockerfile .

      - name: Build inventory service image
        run: docker build -t inventory-service:ci -f inventory_service/Dockerfile .
      - name: Scan RetailOps API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: retailops-api:ci
          format: json
          output: trivy-reports/retailops-api.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      - name: Scan order service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: order-service:ci
          format: json
          output: trivy-reports/order-service.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          skip-setup-trivy: true
      - name: Scan inventory service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inventory-service:ci
          format: json
          output: trivy-reports/inventory-service.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          skip-setup-trivy: true
      - name: Summarize vulnerability severity and remediation status
        if: always()
        run: python scripts/summarize_trivy.py --report-dir trivy-reports

      - name: Upload Trivy JSON reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-vulnerability-reports
          path: trivy-reports/*.json
          if-no-files-found: warn
          retention-days: 30
