name: RetailOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests and validate deployment config
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest tests/test_services.py -v

      - name: Validate Docker Compose configuration
        env:
          GRAFANA_ADMIN_PASSWORD: ci-validation-only-placeholder
        run: docker compose config --quiet

  image-security:
    name: Build and report image vulnerabilities
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p trivy-reports

      - name: Build RetailOps API image
        run: docker build -t retailops-api:ci -f Dockerfile .

      - name: Build order service image
        run: docker build -t order-service:ci -f order_service/Dockerfile .

      - name: Build inventory service image
        run: docker build -t inventory-service:ci -f inventory_service/Dockerfile .

      - name: Scan RetailOps API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: retailops-api:ci
          format: json
          output: trivy-reports/retailops-api.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Scan order service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: order-service:ci
          format: json
          output: trivy-reports/order-service.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          skip-setup-trivy: true

      - name: Scan inventory service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: inventory-service:ci
          format: json
          output: trivy-reports/inventory-service.json
          exit-code: "0"
          ignore-unfixed: "false"
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          skip-setup-trivy: true

      - name: Summarize vulnerability severity
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = [
              ("RetailOps API", Path("trivy-reports/retailops-api.json")),
              ("Order Service", Path("trivy-reports/order-service.json")),
              ("Inventory Service", Path("trivy-reports/inventory-service.json")),
          ]
          severities = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]
          lines = [
              "## Container vulnerability summary",
              "",
              "| Image | " + " | ".join(severities) + " |",
              "|---|" + "|".join(["---:"] * len(severities)) + "|",
          ]

          for name, path in reports:
              counts = {severity: 0 for severity in severities}
              if path.exists():
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                      for result in data.get("Results") or []:
                          for vuln in result.get("Vulnerabilities") or []:
                              severity = vuln.get("Severity", "UNKNOWN").upper()
                              if severity in counts:
                                  counts[severity] += 1
                      row = [name] + [str(counts[s]) for s in severities]
                      lines.append("| " + " | ".join(row) + " |")
                  except (json.JSONDecodeError, OSError) as exc:
                      lines.append(f"| {name} | Report could not be parsed: {exc} |")
              else:
                  lines.append(f"| {name} | Report not generated |")

          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          PY

      - name: Upload Trivy JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-vulnerability-reports
          path: trivy-reports/*.json
          if-no-files-found: warn
          retention-days: 30
