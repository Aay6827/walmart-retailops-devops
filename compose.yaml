services:
  retailops-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailops-api
    ports:
      - "2100:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - retailops-network

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    container_name: retailops-order-service
    environment:
      DATABASE_URL: "postgresql+psycopg://retailops:${POSTGRES_PASSWORD}@postgres:5432/retailops"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2101:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - retailops-network

  inventory-service:
    build:
      context: .
      dockerfile: inventory_service/Dockerfile
    container_name: retailops-inventory-service
    environment:
      DATABASE_URL: "postgresql+psycopg://retailops:${POSTGRES_PASSWORD}@postgres:5432/retailops"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2102:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - retailops-network

  postgres:
    image: postgres:16-alpine
    container_name: retailops-postgres
    environment:
      POSTGRES_DB: retailops
      POSTGRES_USER: retailops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailops_local_dev_only}
    ports:
      - "2103:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U retailops -d retailops
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - retailops-network

networks:
  retailops-network:
    driver: bridge

volumes:
  postgres-data:
