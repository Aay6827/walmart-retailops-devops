services:
  retailops-api:
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,mode=1777"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailops-api
    ports:
      - "2100:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - retailops-network

  order-service:
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,mode=1777"
    build:
      context: .
      dockerfile: order_service/Dockerfile
    container_name: retailops-order-service
    environment:
      DATABASE_URL: "postgresql+psycopg://retailops:${POSTGRES_PASSWORD}@postgres:5432/retailops"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2101:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - retailops-network

  inventory-service:
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,mode=1777"
    build:
      context: .
      dockerfile: inventory_service/Dockerfile
    container_name: retailops-inventory-service
    environment:
      DATABASE_URL: "postgresql+psycopg://retailops:${POSTGRES_PASSWORD}@postgres:5432/retailops"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "2102:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - retailops-network

  postgres:
    image: postgres:16-alpine
    container_name: retailops-postgres
    environment:
      POSTGRES_DB: retailops
      POSTGRES_USER: retailops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailops_local_dev_only}
    ports:
      - "2103:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U retailops -d retailops
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - retailops-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: retailops-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "2104:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    depends_on:
      retailops-api:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    networks:
      - retailops-network

  grafana:
    image: grafana/grafana:12.1.1
    container_name: retailops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "2105:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - retailops-network
networks:
  retailops-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
