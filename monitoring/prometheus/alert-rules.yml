groups:
  - name: retailops-service-alerts
    rules:
      - alert: RetailOpsServiceDown
        expr: up{job=~"retailops-api|order-service|inventory-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RetailOps service is unavailable"
          description: "Prometheus cannot scrape service {{ $labels.job }}."

      - alert: RetailOpsHighHttp5xxRate
        expr: |
          (
            sum by (job) (
              rate(http_requests_total{
                job=~"retailops-api|order-service|inventory-service",
                status=~"5.."
              }[5m])
            )
            /
            clamp_min(
              sum by (job) (
                rate(http_requests_total{
                  job=~"retailops-api|order-service|inventory-service"
                }[5m])
              ),
              0.001
            )
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "More than 5% of requests to {{ $labels.job }} are returning HTTP 5xx responses."

      - alert: RetailOpsHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, job) (
              rate(http_request_duration_seconds_bucket{
                job=~"retailops-api|order-service|inventory-service"
              }[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 request latency"
          description: "The estimated p95 HTTP latency for {{ $labels.job }} exceeds one second."
